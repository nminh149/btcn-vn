<!DOCTYPE html>
<html lang="vi">

<head>
    <title>Tạo responsive</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        .left,
        .right {
            height: 400px;
        }

        .left {
            background: blue;
            float: left;
            width: 70%;
        }

        .right {
            background: red;
            float: right;
            width: 30%;
        }

        /* Nếu chiều rộng màn hình từ 768px trở xuống */
        @media only screen and (max-width: 768px) {

            .left,
            .right {
                width: 100%;
            }
        }

        /* Nếu chiều rộng màn hình từ 320px đến 480px thì ẩn right */
        @media only screen and (min-width: 320px) and (max-width: 480px) {
            .right {
                display: none;
            }
        }

        /* Nếu là chế độ máy in thì ẩn left và mở rộng right */
        @media only print {
            .left {
                display: none;
            }

            .right {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <!-- Responsive Image -->

    <!-- Responsive Column -->
    <div class="container">
        <div class="left">
            <picture>
                <source width="400" media="(min-width: 800px)" srcset="https://www.ueh.edu.vn/images/logo-header.png">
                <source width="400" media="(min-width: 600px)"
                    srcset="https://ctd.ueh.edu.vn/wp-content/uploads/2023/07/cropped-TV_trang_CTD.png">
                <img src="https://ueh.edu.vn/schools/college/images/logo/bit-header-logo.png" alt="Responsive Image">
            </picture>

            LEFT
        </div>
        <div class="right">RIGHT</div>
    </div>
</body>

</html>
